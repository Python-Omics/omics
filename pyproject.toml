[project]
name = "pythomics"
version = "0.1.0a1"
description = "Port of mixOmics (R/Bioconductor) to Python — multivariate methods for multi-omics integration"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Pythomics Group 02 - UdeC" },
]
requires-python = ">=3.13"

# Dependencias core (las mínimas para que los modelos funcionen)
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.4",
    "networkx>=3.2",
]

# Dependencias opcionales (no se instalan con `pip install pythomics`)
# Se activan con: pip install pythomics[r]   → requiere R instalado
#                 pip install pythomics[llm]  → para integración con LLM
#                 pip install pythomics[viz]  → para visualizaciones
#                 pip install pythomics[annot] → para anotación biológica
#                 pip install pythomics[all]  → todo
[project.optional-dependencies]
r = [
    "rpy2>=3.5",
]
llm = [
    "openai>=1.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]
viz = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pycirclize>=1.0",
    "adjustText>=0.8",
]
annot = [
    "biothings_client[dataframe]>=0.11",
    "fpdf2>=2.7",
]
omics = [
    "muon>=0.1.5",
    "anndata>=0.10",
    "pydeseq2>=0.4",
]
all = [
    "pythomics[r,llm,viz,annot,omics]",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pythomics"]